<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fb">
<meta name="description" content="Thrive — premium student money planner">
<link rel="manifest" href="manifest.webmanifest">
<title>Thrive — Student Money Planner</title>
<style>
:root{
 --bg:#f6f8fb;--surface:#fff;--surface2:#f0f3f7;--text:#101521;--muted:#697386;
 --line:#e4e8ef;--green:#16b982;--green2:#0d9f70;--purple:#735cff;--red:#ef5365;
 --shadow:0 18px 50px rgba(24,32,52,.09);--radius:22px;--accent:var(--green);
}
body.dark{
 --bg:#090c12;--surface:#111722;--surface2:#171e2b;--text:#f4f7fb;--muted:#9aa6b8;
 --line:#242d3b;--shadow:0 22px 60px rgba(0,0,0,.32);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .35s,color .35s}
button,input,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);z-index:10}
.logo{display:flex;gap:11px;align-items:center;padding:8px 10px 28px;font-weight:900;font-size:23px;letter-spacing:-.8px}
.logoMark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--purple));display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(115,92,255,.25)}
.nav{display:grid;gap:7px}.nav button,.mobileNav button{border:0;background:transparent;color:var(--muted);padding:12px 13px;border-radius:14px;text-align:left;display:flex;gap:11px;align-items:center;font-weight:700;transition:.22s}
.nav button:hover,.nav button.active,.mobileNav button.active{background:var(--surface2);color:var(--text);transform:translateX(2px)}
.sidebarBottom{position:absolute;left:16px;right:16px;bottom:20px}.profile{padding:13px;border:1px solid var(--line);border-radius:18px;background:var(--surface2)}
.main{min-width:0}.top{position:sticky;top:0;z-index:8;padding:18px 30px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center}
.title{font-size:26px;font-weight:900;letter-spacing:-.7px}.sub{color:var(--muted);font-size:13px;margin-top:3px}
.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:10px 13px;font-weight:800;transition:.2s;box-shadow:0 5px 16px rgba(0,0,0,.04)}.btn:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.08)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.content{padding:28px 30px 100px;max-width:1400px;margin:auto}.page{animation:pageIn .45s both}@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s}.card:hover{transform:translateY(-3px);box-shadow:0 25px 65px rgba(24,32,52,.12)}
.kicker{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:950;letter-spacing:-1px;margin-top:8px}.small{font-size:13px;color:var(--muted)}
.hero{padding:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface));overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-90px;top:-120px;background:linear-gradient(135deg,var(--green),var(--purple));opacity:.16;filter:blur(4px)}
.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.progress{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:inherit;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.pulse{display:flex;align-items:center;gap:13px}.ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p,0%),var(--surface2) 0);position:relative}.ring:after{content:"";position:absolute;inset:8px;background:var(--surface);border-radius:50%}.ring b{position:relative;z-index:1;font-size:15px}
.list{display:grid;gap:10px;margin-top:15px}.item{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}.icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:900}
.amount{font-weight:900}.negative{color:var(--red)}.positive{color:var(--green2)}
.form{display:grid;gap:13px}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}label{display:grid;gap:7px;font-size:12px;color:var(--muted);font-weight:800}input,select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:12px 13px;border-radius:13px;outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);padding:8px 11px;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:800;font-size:12px}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.setting{padding:16px;border:1px solid var(--line);border-radius:17px;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;gap:15px}.switch{width:48px;height:28px;border-radius:99px;background:#9aa3b1;padding:3px;border:0}.switch i{display:block;width:22px;height:22px;background:#fff;border-radius:50%;transition:.25s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(20px)}
.toast{position:fixed;right:20px;bottom:22px;z-index:50;background:var(--text);color:var(--bg);padding:13px 16px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);animation:toast .3s both}@keyframes toast{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.modalBack{position:fixed;inset:0;background:rgba(4,7,12,.58);display:none;place-items:center;z-index:40;padding:18px;backdrop-filter:blur(8px)}.modalBack.show{display:grid}.modal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:25px;padding:22px;animation:modal .28s both}@keyframes modal{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:45px 20px;color:var(--muted)}.barChart{height:190px;display:flex;align-items:end;gap:8px;padding-top:18px}.bar{flex:1;min-width:8px;background:linear-gradient(180deg,var(--purple),var(--accent));border-radius:8px 8px 2px 2px;animation:grow .7s both;transform-origin:bottom}@keyframes grow{from{height:0!important}to{}}
.onboard{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#07120f,#11132b);display:grid;place-items:center;padding:22px;color:#fff}.onboard.hidden{display:none}.obCard{width:min(650px,100%);text-align:center;padding:40px 28px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(255,255,255,.07);backdrop-filter:blur(25px);box-shadow:0 30px 100px rgba(0,0,0,.35)}.obIcon{width:74px;height:74px;border-radius:24px;margin:0 auto 22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--purple));font-size:30px}.dots{display:flex;justify-content:center;gap:6px;margin:25px}.dot{width:7px;height:7px;border-radius:50%;background:#667}.dot.on{width:22px;background:#fff}
.mobileNav{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two,.three,.settingsGrid{grid-template-columns:1fr}}
@media(max-width:760px){.app{display:block}.sidebar{display:none}.top{padding:15px 16px}.content{padding:20px 16px 95px}.title{font-size:21px}.actions .hideMob{display:none}.stats{grid-template-columns:1fr 1fr}.card{padding:17px;border-radius:19px}.formGrid{grid-template-columns:1fr}.mobileNav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:10px;right:10px;bottom:10px;padding:7px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(20px);z-index:20;box-shadow:0 15px 45px rgba(0,0,0,.15)}.mobileNav button{padding:8px 4px;display:grid;gap:3px;place-items:center;font-size:10px;text-align:center}.mobileNav button:hover,.mobileNav button.active{transform:none}.value{font-size:23px}}
@media(max-width:420px){.stats{grid-template-columns:1fr}.hero{padding:20px}}
.reduce *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="onboarding" class="onboard hidden"></div>
<div class="app">
<aside class="sidebar">
<div class="logo"><span class="logoMark">T</span>Thrive</div>
<nav class="nav" id="sideNav"></nav>
<div class="sidebarBottom"><div class="profile"><div class="small">Signed in locally</div><b id="sideName">Your Thrive</b></div></div>
</aside>
<main class="main">
<header class="top"><div><div class="title" id="pageTitle">Dashboard</div><div class="sub" id="pageSub">Your money, made clearer.</div></div><div class="actions"><button class="btn hideMob" onclick="go('settings')">⚙ Settings</button><button class="btn primary" onclick="openTx()">＋ Add</button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<nav class="mobileNav" id="mobileNav"></nav>
<div class="modalBack" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const KEY='thrive_6';
const defaultState=()=>({firstRun:true,name:'',currency:'GHS',theme:'system',accent:'green',cardStyle:'soft',density:'comfortable',animations:true,reduceMotion:false,income:0,budget:0,budgetMonth:new Date().toISOString().slice(0,7),categories:[['Food & groceries',0,'🍲'],['Transport',0,'🚌'],['School & data',0,'📚'],['Fun & extras',0,'🎮']],goals:[],tx:[]});
let S=JSON.parse(localStorage.getItem(KEY)||'null')||defaultState();
let route=location.hash.slice(1)||'dashboard';
const nav=[['dashboard','⌂','Dashboard'],['budget','◫','Budget'],['goals','◎','Goals'],['transactions','↔','Transactions'],['insights','◒','Insights'],['settings','⚙','Settings']];
function save(){localStorage.setItem(KEY,JSON.stringify(S));applyTheme();render()}
function money(n){return `${S.currency} ${Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`}
function expenses(){return S.tx.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0)}
function incomeTx(){return S.tx.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0)}
function saved(){return S.goals.reduce((a,g)=>a+Number(g.current||0),0)}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function applyTheme(){
 const prefers=matchMedia('(prefers-color-scheme:dark)').matches;
 document.body.classList.toggle('dark',S.theme==='dark'||(S.theme==='system'&&prefers));
 document.body.classList.toggle('reduce',S.reduceMotion||!S.animations);
 document.documentElement.style.setProperty('--accent',S.accent==='purple'?'#735cff':S.accent==='blue'?'#3b82f6':S.accent==='orange'?'#f59e0b':'#16b982');
 document.documentElement.style.setProperty('--radius',S.cardStyle==='glass'?'25px':S.cardStyle==='solid'?'16px':'22px');
 document.body.style.setProperty('--shadow',S.cardStyle==='solid'?'0 8px 22px rgba(0,0,0,.06)':'0 18px 50px rgba(24,32,52,.09)');
}
function navHTML(){return nav.map(n=>`<button class="${route===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}
function renderNav(){sideNav.innerHTML=navHTML();mobileNav.innerHTML=nav.filter(x=>['dashboard','budget','goals','transactions','settings'].includes(x[0])).map(n=>`<button class="${route===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span><span>${n[2]}</span></button>`).join('');sideName.textContent=S.name||'Your Thrive'}
function go(r){route=r;location.hash=r;render()}
function render(){
 applyTheme();renderNav();
 const titles={dashboard:['Dashboard','Your money, made clearer.'],budget:['Budget','Control every part of your month.'],goals:['Savings goals','Give your goals a plan.'],transactions:['Transactions','Every inflow and outflow, in one place.'],insights:['Insights','Understand your money patterns.'],settings:['Settings','Make Thrive yours.']};
 pageTitle.textContent=titles[route]?.[0]||'Dashboard';pageSub.textContent=titles[route]?.[1]||'';
 content.innerHTML=`<div class="page">${pages[route]||pages.dashboard}</div>`;
 setTimeout(()=>document.querySelectorAll('.progress>i').forEach(x=>x.style.width=x.dataset.w+'%'),60);
}
const pages={
dashboard:()=>{let e=expenses(),remaining=Math.max(0,S.budget-e),safe=Math.max(0,S.income-e);let health=pct(e,S.budget);
return `<div class="grid two"><section class="card hero"><div class="kicker">Welcome back</div><h1 style="margin:7px 0 6px;font-size:32px;letter-spacing:-1.2px">${S.name?S.name+',':'Your'} money has a home.</h1><p class="small">Start from zero, then build your plan one move at a time.</p><div class="grid stats" style="margin-top:22px"><div><div class="kicker">Income</div><div class="value">${money(S.income)}</div></div><div><div class="kicker">Spent</div><div class="value">${money(e)}</div></div></div></section>
<section class="card"><div class="row"><div><div class="kicker">Safe to spend</div><div class="value">${money(safe)}</div><div class="small">Income minus expenses</div></div><div class="ring" style="--p:${Math.min(100,pct(e,S.income))}%"><b>${Math.min(100,pct(e,S.income))}%</b></div></div><div style="margin-top:20px"><div class="row small"><span>Budget used</span><b>${health}%</b></div><div class="progress"><i data-w="${health}"></i></div></div></section></div>
<div class="grid stats" style="margin-top:16px"><div class="card"><div class="kicker">Monthly budget</div><div class="value">${money(S.budget)}</div><div class="small">${money(remaining)} remaining</div></div><div class="card"><div class="kicker">Saved</div><div class="value">${money(saved())}</div><div class="small">${S.goals.length} active goals</div></div><div class="card"><div class="kicker">Transactions</div><div class="value">${S.tx.length}</div><div class="small">Income + expenses</div></div><div class="card"><div class="kicker">Thrive score</div><div class="value">${score()}</div><div class="small">Based on your setup</div></div></div>
<div class="grid two" style="margin-top:16px"><section class="card"><div class="row"><h3>Recent activity</h3><button class="btn" onclick="go('transactions')">View all</button></div>${recent()}</section><section class="card"><h3>Quick moves</h3><div class="list"><button class="item" onclick="openTx()" style="border:0;color:inherit;text-align:left">＋ Add transaction <span>›</span></button><button class="item" onclick="go('budget')" style="border:0;color:inherit;text-align:left">◫ Set monthly budget <span>›</span></button><button class="item" onclick="openGoal()" style="border:0;color:inherit;text-align:left">◎ Create savings goal <span>›</span></button></div></section></div>`},
budget:()=>`<div class="grid two"><section class="card"><div class="row"><div><div class="kicker">Monthly plan</div><h2 style="margin:5px 0">Your budget control center</h2></div><button class="btn primary" onclick="openBudget()">Edit plan</button></div><div class="grid stats" style="margin-top:20px"><div><div class="kicker">Income</div><div class="value">${money(S.income)}</div></div><div><div class="kicker">Budget</div><div class="value">${money(S.budget)}</div></div><div><div class="kicker">Spent</div><div class="value">${money(expenses())}</div></div><div><div class="kicker">Available</div><div class="value">${money(Math.max(0,S.budget-expenses()))}</div></div></div><div style="margin-top:22px"><div class="row small"><span>Budget health</span><b>${pct(expenses(),S.budget)}%</b></div><div class="progress"><i data-w="${pct(expenses(),S.budget)}"></i></div></div></section>
<section class="card"><div class="row"><h3>Category budgets</h3><button class="btn" onclick="openCategory()">＋ Category</button></div><div class="list">${S.categories.map(c=>{let spent=S.tx.filter(t=>t.type==='expense'&&t.category===c[0]).reduce((a,t)=>a+Number(t.amount),0);return `<div><div class="row"><div><b>${c[2]} ${c[0]}</b><div class="small">${money(spent)} / ${money(c[1])}</div></div><b>${pct(spent,c[1])}%</b></div><div class="progress" style="margin-top:8px"><i data-w="${pct(spent,c[1])}"></i></div></div>`}).join('')}</div></section></div>`,
goals:()=>`<div class="row" style="margin-bottom:16px"><div><div class="kicker">Your targets</div><h2 style="margin:5px 0">Build something you want</h2></div><button class="btn primary" onclick="openGoal()">＋ New goal</button></div><div class="grid three">${S.goals.length?S.goals.map((g,i)=>`<section class="card"><div class="row"><div class="icon">${g.icon||'◎'}</div><button class="btn" onclick="contribute(${i})">＋ Add</button></div><h3>${g.name}</h3><div class="row small"><span>${money(g.current)} saved</span><b>${pct(g.current,g.target)}%</b></div><div class="progress" style="margin-top:8px"><i data-w="${pct(g.current,g.target)}"></i></div><div class="small" style="margin-top:10px">${money(Math.max(0,g.target-g.current))} remaining${g.deadline?' · '+g.deadline:''}</div></section>`).join(''):`<section class="card empty" style="grid-column:1/-1"><div style="font-size:42px">◎</div><h3>No goals yet</h3><p>Create your first savings goal and start from zero.</p><button class="btn primary" onclick="openGoal()">Create first goal</button></section>`}</div>`,
transactions:()=>`<section class="card"><div class="row"><div><div class="kicker">Money log</div><h2 style="margin:5px 0">Transactions</h2></div><button class="btn primary" onclick="openTx()">＋ Add</button></div><div class="formGrid" style="margin-top:18px"><label>Search<input id="txSearch" oninput="filterTx()" placeholder="Search transactions..."></label><label>Type<select id="txType" onchange="filterTx()"><option value="all">All</option><option value="income">Income</option><option value="expense">Expense</option></select></label></div><div id="txList" style="margin-top:15px">${txTable()}</div></section>`,
insights:()=>{let e=expenses(), inc=S.income+incomeTx(), rate=inc?Math.round(saved()/inc*100):0;let cats=S.categories.map(c=>[c[0],S.tx.filter(t=>t.type==='expense'&&t.category===c[0]).reduce((a,t)=>a+Number(t.amount),0)]).sort((a,b)=>b[1]-a[1]);return `<div class="grid stats"><div class="card"><div class="kicker">Savings rate</div><div class="value">${rate}%</div><div class="small">Based on saved goals</div></div><div class="card"><div class="kicker">Top category</div><div class="value">${cats[0]?.[0]||'—'}</div><div class="small">${money(cats[0]?.[1]||0)}</div></div><div class="card"><div class="kicker">Total inflow</div><div class="value">${money(inc)}</div></div><div class="card"><div class="kicker">Thrive score</div><div class="value">${score()}</div></div></div><div class="grid two" style="margin-top:16px"><section class="card"><h3>Spending breakdown</h3>${cats.map(c=>`<div style="margin:15px 0"><div class="row small"><span>${c[0]}</span><b>${money(c[1])}</b></div><div class="progress" style="margin-top:7px"><i data-w="${e?Math.round(c[1]/e*100):0}"></i></div></div>`).join('')}</section><section class="card"><h3>Smart moves</h3><div class="list"><div class="item">💡 Set your monthly income and budget first.</div><div class="item">🎯 Add a goal with a deadline for clearer progress.</div><div class="item">📊 Keep transactions updated for better insights.</div></div></section></div>`},
settings:()=>`<div class="grid two"><section class="card"><div class="kicker">Personalization</div><h2>Make Thrive yours</h2><div class="form" style="margin-top:16px"><label>Your name<input value="${S.name}" onchange="S.name=this.value;save()" placeholder="e.g. Kingsford"></label><label>Currency<select onchange="S.currency=this.value;save()">${['GHS','USD','NGN','GBP'].map(x=>`<option ${S.currency===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Theme<select onchange="S.theme=this.value;save()"><option value="system" ${S.theme==='system'?'selected':''}>🌓 System</option><option value="light" ${S.theme==='light'?'selected':''}>☀️ Light</option><option value="dark" ${S.theme==='dark'?'selected':''}>🌙 Dark</option></select></label><label>Accent<select onchange="S.accent=this.value;save()"><option value="green" ${S.accent==='green'?'selected':''}>Emerald</option><option value="purple" ${S.accent==='purple'?'selected':''}>Purple</option><option value="blue" ${S.accent==='blue'?'selected':''}>Blue</option><option value="orange" ${S.accent==='orange'?'selected':''}>Orange</option></select></label></div></section>
<section class="card"><div class="kicker">Interface</div><h2>Display & motion</h2><div class="list"><div class="setting"><div><b>Premium animations</b><div class="small">Page, chart and number motion</div></div><button class="switch ${S.animations?'on':''}" onclick="S.animations=!S.animations;save()"><i></i></button></div><div class="setting"><div><b>Reduced motion</b><div class="small">Minimize movement</div></div><button class="switch ${S.reduceMotion?'on':''}" onclick="S.reduceMotion=!S.reduceMotion;save()"><i></i></button></div><div class="setting"><div><b>Card style</b><div class="small">Soft, glass or solid surfaces</div></div><select style="width:120px" onchange="S.cardStyle=this.value;save()"><option value="soft" ${S.cardStyle==='soft'?'selected':''}>Soft</option><option value="glass" ${S.cardStyle==='glass'?'selected':''}>Glass</option><option value="solid" ${S.cardStyle==='solid'?'selected':''}>Solid</option></select></div><div class="setting"><div><b>Layout density</b><div class="small">Choose your spacing</div></div><select style="width:120px" onchange="S.density=this.value;save()"><option value="comfortable" ${S.density==='comfortable'?'selected':''}>Comfort</option><option value="compact" ${S.density==='compact'?'selected':''}>Compact</option></select></div></div></section></div>
<div class="card" style="margin-top:16px"><div class="kicker">Data</div><h2>Backup & reset</h2><div class="actions" style="margin-top:15px;flex-wrap:wrap"><button class="btn" onclick="exportData()">Export backup</button><button class="btn" onclick="importData()">Import backup</button><button class="btn" onclick="restartTutorial()">Replay tutorial</button><button class="btn" onclick="resetData()">Reset Thrive</button></div></div>`
};
pages.dashboard=pages.dashboard();pages.budget=pages.budget();pages.goals=pages.goals();pages.transactions=pages.transactions();pages.insights=pages.insights();pages.settings=pages.settings();

function score(){let s=0;if(S.income>0)s+=25;if(S.budget>0)s+=25;if(S.goals.length)s+=20;if(S.tx.length)s+=20;if(expenses()<=S.budget||S.budget===0)s+=10;return s}
function recent(){if(!S.tx.length)return `<div class="empty">No transactions yet.<br>Add your first one to start building your money picture.</div>`;return `<div class="list">${S.tx.slice(-5).reverse().map(t=>`<div class="item"><div class="row" style="justify-content:flex-start"><div class="icon">${t.type==='income'?'↗':'↘'}</div><div><b>${t.desc}</b><div class="small">${t.category||'Income'} · ${t.date}</div></div></div><span class="amount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'-'}${money(t.amount)}</span></div>`).join('')}</div>`}
function txTable(){if(!S.tx.length)return `<div class="empty">No transactions yet.</div>`;return `<table><thead><tr><th>Item</th><th>Type</th><th>Category</th><th>Amount</th><th></th></tr></thead><tbody id="tbody">${S.tx.slice().reverse().map((t,i)=>`<tr data-search="${(t.desc+' '+(t.category||'')).toLowerCase()}" data-type="${t.type}"><td><b>${t.desc}</b><div class="small">${t.date}</div></td><td>${t.type}</td><td>${t.category||'—'}</td><td class="${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'-'}${money(t.amount)}</td><td><button class="btn" onclick="delTx(${S.tx.length-1-i})">Delete</button></td></tr>`).join('')}</tbody></table>`}
function filterTx(){let q=(document.getElementById('txSearch')?.value||'').toLowerCase(),type=document.getElementById('txType')?.value||'all';document.querySelectorAll('#tbody tr').forEach(r=>r.style.display=((r.dataset.search.includes(q))&&(type==='all'||r.dataset.type===type))?'':'none')}
function openModal(inner){modal.innerHTML=inner;modalBack.classList.add('show')}
function closeModal(){modalBack.classList.remove('show')}
function openTx(){openModal(`<div class="row"><h2>Add transaction</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Type<select id="mType" onchange="document.getElementById('mCat').disabled=this.value==='income'"><option value="expense">Expense</option><option value="income">Income</option></select></label><label>Amount<input id="mAmt" type="number" min="0" step=".01" placeholder="0.00"></label><label>Description<input id="mDesc" placeholder="e.g. Lunch"></label><label>Category<select id="mCat">${S.categories.map(c=>`<option>${c[0]}</option>`).join('')}</select></label><label>Date<input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="btn primary" onclick="addTx()">Save transaction</button></div>`)}
function addTx(){let amt=Number(mAmt.value);if(!amt||amt<0)return toast('Enter a valid amount');S.tx.push({type:mType.value,amount:amt,desc:mDesc.value||'Untitled',category:mType.value==='income'?'Income':mCat.value,date:mDate.value});closeModal();save();toast('Transaction added')}
function delTx(i){if(!confirm('Delete this transaction?'))return;S.tx.splice(i,1);save();toast('Transaction deleted')}
function openBudget(){openModal(`<div class="row"><h2>Edit monthly plan</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Monthly income<input id="bIncome" type="number" min="0" value="${S.income}"></label><label>Total spending budget<input id="bBudget" type="number" min="0" value="${S.budget}"></label><label>Budget month<input id="bMonth" type="month" value="${S.budgetMonth}"></label><button class="btn primary" onclick="S.income=Number(bIncome.value)||0;S.budget=Number(bBudget.value)||0;S.budgetMonth=bMonth.value;closeModal();save();toast('Budget updated')">Save plan</button></div>`)}
function openCategory(){openModal(`<div class="row"><h2>New category</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Name<input id="cName" placeholder="e.g. Health"></label><label>Budget<input id="cBudget" type="number" min="0" value="0"></label><label>Icon<input id="cIcon" value="✨"></label><button class="btn primary" onclick="S.categories.push([cName.value||'New category',Number(cBudget.value)||0,cIcon.value||'✨']);closeModal();save();toast('Category added')">Add category</button></div>`)}
function openGoal(){openModal(`<div class="row"><h2>New savings goal</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Goal name<input id="gName" placeholder="e.g. New phone"></label><label>Target amount<input id="gTarget" type="number" min="0" value="0"></label><label>Deadline<input id="gDate" type="date"></label><label>Icon<input id="gIcon" value="🎯"></label><button class="btn primary" onclick="S.goals.push({name:gName.value||'New goal',target:Number(gTarget.value)||0,current:0,deadline:gDate.value,icon:gIcon.value||'🎯'});closeModal();save();toast('Goal created')">Create goal</button></div>`)}
function contribute(i){openModal(`<div class="row"><h2>Add to ${S.goals[i].name}</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form"><label>Contribution<input id="conAmt" type="number" min="0" value="0"></label><button class="btn primary" onclick="let a=Number(conAmt.value)||0;S.goals[${i}].current+=a;closeModal();save();toast('Goal updated')">Add contribution</button></div>`)}
function toast(msg){let x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='thrive-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=='object')throw 0;S={...defaultState(),...x,firstRun:false};save();toast('Backup restored')}catch(e){toast('Invalid backup')}};r.readAsText(f)};i.click()}
function resetData(){if(!confirm('Reset all Thrive data to zero?'))return;S=defaultState();localStorage.setItem(KEY,JSON.stringify(S));location.reload()}
function restartTutorial(){S.firstRun=true;save();startTutorial()}
const steps=[
['Welcome to Thrive','A premium money planner built to help you understand, plan and grow your money.'],['Start from zero','Your first Thrive setup starts with GHS 0 — no fake numbers, no preloaded transactions.'],['Build your plan','Set your income, monthly budget and category limits whenever you are ready.'],['Create goals','Give savings goals a target, deadline and progress plan.'],['Track every move','Add income and expenses so your dashboard and insights become useful.'],['Make it yours','Choose light, dark or system mode, accents, card styles and motion preferences.']
];let obStep=0;
function startTutorial(){obStep=0;drawOb();onboarding.classList.remove('hidden')}
function drawOb(){let s=steps[obStep];onboarding.innerHTML=`<div class="obCard"><div class="obIcon">${['✦','0','◫','◎','↔','🎨'][obStep]}</div><div class="kicker" style="color:#a9b0c3">THRIVE · ${obStep+1}/${steps.length}</div><h1 style="font-size:32px;margin:10px 0">${s[0]}</h1><p style="color:#c7ccda;line-height:1.7">${s[1]}</p><div class="dots">${steps.map((_,i)=>`<span class="dot ${i===obStep?'on':''}"></span>`).join('')}</div><div class="actions" style="justify-content:center"><button class="btn" onclick="skipOb()">Skip</button><button class="btn primary" onclick="nextOb()">${obStep===steps.length-1?'Start thriving':'Continue'}</button></div></div>`}
function nextOb(){if(obStep<steps.length-1){obStep++;drawOb()}else{S.firstRun=false;save();onboarding.classList.add('hidden');toast('Welcome to Thrive')}}
function skipOb(){S.firstRun=false;save();onboarding.classList.add('hidden')}
window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'dashboard';render()});
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>S.theme==='system'&&applyTheme());
applyTheme();render();
if(S.firstRun)startTutorial();
</script>
</body></html>
