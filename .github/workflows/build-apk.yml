name: Build Thrive APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Install tools
        run: npm install --legacy-peer-deps

      - name: Copy the web app into www
        run: |
          mkdir -p www
          for f in index.html sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
            if [ -f "$f" ]; then cp "$f" www/; else echo "Missing $f"; fi
          done
          ls -la www

      - name: Add Android
        run: npx cap add android
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: App icon
        run: |
          IM=$(command -v magick || command -v convert)
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p android/app/src/main/res/mipmap-$d
            $IM icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      - name: Build with fingerprint and face unlock
        id: bio
        continue-on-error: true
        run: |
          npm install @aparajita/capacitor-biometric-auth --legacy-peer-deps
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Fallback build without the biometric plugin
        if: steps.bio.outcome == 'failure'
        run: |
          npm uninstall @aparajita/capacitor-biometric-auth --legacy-peer-deps || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Thrive-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
